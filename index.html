<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battleships</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="return-container">
        <button id="returnBtn" class="return-button">
            ← Return
        </button>
    </div>

    <main class="app">
        <header class="site-header">
            <h1>BATTLESHIPS</h1>
        </header>

        <section class="toolbar" aria-label="Game Settings">
            <label for="difficulty">Difficulty</label>
            <select name="difficulty" id="difficulty">
                <option value="easy">Easy - 6 x 6</option>
                <option value="medium">Medium - 8 x 8</option>
                <option value="hard">Hard - 10 x 10</option>
            </select>
            <button id="newGameBtn" class="primary">New Puzzle</button>
        </section>

        <section class="game-panel">
            <div class="game-meta">
                <span id="difficultyLabel">Medium</span>
                <span id="timer">00:00</span>
            </div>

            <div id="board" class="board" aria-label="Puzzle board"></div>

            <div class="fleet-panel">
                <h2>Fleet to find</h2>
                <div id="fleet" class="fleet"></div>
            </div>

            <p class="instructions">
                Select Ship, Sea, or Clear from the toolbar.
                Left-click to use the selected tool.
                Right-click a square to mark it as sea.
                Ships cannot touch, even diagonally.
            </p>

            <div class="actions">
                <button id="checkBtn" class="primary">Check Answer</button>
                <button id="hintBtn">Hint</button>
                <button id="clearBtn">Clear</button>
                <button id="revealBtn">Reveal</button>
            </div>

            <div class="tool-spacer"></div>

            <div class="tool-toolbar" role="group" aria-label="Drawing tools">
                <button id="tool-ship" class="tool-button active" type="button" aria-pressed="true">
                    <span class="tool-symbol ship-symbol"></span>
                    Ship
                </button>

                <button id="tool-water" class="tool-button" type="button" aria-pressed="false">
                    <span class="tool-symbol water-symbol"></span>
                    Sea
                </button>

                <button id="tool-clear" class="tool-button" type="button" aria-pressed="false">
                    <span class="tool-symbol clear-symbol"></span>
                    Clear
                </button>
            </div>

            <p id="message" class="message" role="status" aria-live="polite"></p>
        </section>

        <footer>
            <p>Classic Battleships logic puzzles</p>
        </footer>
    </main>
</body>
</html>
